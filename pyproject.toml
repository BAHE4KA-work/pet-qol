[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.1.0"
description = "Autonomous AI Life Planner (LifeOS) with 3-tier Gemini/Gemma routing, Goldilocks adaptive budget, and Apple/Notion/Telegram/Gmail sync."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "google-genai>=3.5.0",
    "httpx>=0.28",
    "aiogram>=3.15",
    "telethon>=1.37",
    "notion-client>=2.2",
    "caldav>=1.4",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
    "cryptography>=44.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["lifeos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
